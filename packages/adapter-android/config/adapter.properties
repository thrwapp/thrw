# Build-time configuration for the Android adapter (ADR 0005).
#
# Every endpoint this adapter talks to lives here, never inline in Kotlin
# source. `app/build.gradle.kts` reads this file and generates
# com.thrw.adapter.android.config.BuildConfig from it, which is the only
# place the values appear in compiled code.
#
# Self-hosting: point these at your own relay / Keygen instance and
# rebuild - no source edits needed. Set selfHosted=true to skip Keygen
# validation entirely (ADR 0005's SELF_HOSTED build flag), so running your
# own relay doesn't also require standing up licensing.

# MQTT over WebSocket/TLS per ADR 0001. Port 443 (the wss default,
# omitted here - RelayConfig.fromUrl falls back to it): Caddy terminates
# TLS on 443 and reverse-proxies to EMQX's own plaintext ws:8083 (#119,
# see services/relay-hosted/Caddyfile and emqx.conf's own comment) -
# EMQX's *native* TLS listener (port 8084) is deliberately unused, so
# this is not that port. Previously read `:8884` here, a typo for 8084
# that was never reachable either way - fixed alongside the real TLS
# rollout rather than left as a stale placeholder.
relay.url=wss://relay.thrw.app/mqtt

# Keygen validation endpoint (services/licensing). Unused until the
# licensing wiring issue lands; carried here so it never gets hardcoded.
licensing.url=https://licensing.thrw.app

selfHosted=false

# MQTT credential for the relay (#147). Deliberately EMPTY here, and
# deliberately not committed with a value: the deployed EMQX runs
# allow_anonymous=false (#80/#93), so an adapter with no credential is
# rejected at connect with badUserNameOrPassword.
#
# Supply the real value in config/adapter.local.properties, which is
# gitignored and overrides any key set here:
#
#     relay.username=...
#     relay.password=...
#
# Leave both blank to connect anonymously - correct for a local or
# self-hosted broker with allow_anonymous on, which is how this module's
# tests run.
#
# Known limitation, stated plainly: the value still ends up compiled into
# the built APK, so anyone who can read the app can recover it. That is
# fine for internal builds on Tom's own devices sharing one relay
# credential; it is NOT fine for public Play Store distribution, which
# needs per-device credentials from services/accounts (M7). See
# docs/handoffs/147.md.
relay.username=
relay.password=

# Backslashes differ between the two adapters, verified by running both
# generators (#147). Android reads this with Java Properties.load(), where
# "\\" is an escape character, so a literal backslash must be DOUBLED
# ("p\\\\ss" yields p\\ss). The Mac generator is a shell script that takes
# the raw text, so it does NOT apply that escaping and the same line would
# yield a different password there. The real relay credential is
# alphanumeric plus dashes, so this does not bite today - but a password
# containing a backslash will silently authenticate on one platform and
# fail on the other. Avoid backslashes, or set each platform separately.
