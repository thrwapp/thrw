# Required by AGP as soon as any androidx artifact is on the classpath -
# #102 added androidx.activity (ComponentActivity +
# ActivityResultContracts.RequestMultiplePermissions, see
# app/build.gradle.kts), and the build fails outright without this flag.
# This module has no pre-AndroidX (android.support.*) dependencies at all,
# so nothing needs Jetifier (android.enableJetifier) alongside it.
android.useAndroidX=true
