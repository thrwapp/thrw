# Build-time configuration for the Mac adapter (ADR 0005).
#
# Every endpoint this adapter talks to lives here, never inline in Swift
# source. GenerateAdapterConfigPlugin (Plugins/GenerateAdapterConfigPlugin/)
# reads this file and generates AdapterBuildConfig.swift from it at build
# time - same discipline `packages/adapter-android`'s own
# config/adapter.properties + Gradle generateAdapterBuildConfig task use,
# a per-adapter copy of the same file shape (ADR 0005: "a config file per
# adapter").
#
# Self-hosting: point these at your own relay / Keygen instance and
# rebuild - no source edits needed. Set selfHosted=true to skip Keygen
# validation entirely (ADR 0005's SELF_HOSTED build flag), so running your
# own relay doesn't also require standing up licensing.

# MQTT over WebSocket/TLS per ADR 0001. Port 443 (the wss default,
# omitted here - RelayConfig.from falls back to it): Caddy terminates TLS
# on 443 and reverse-proxies to EMQX's own plaintext ws:8083 (#119, see
# services/relay-hosted/Caddyfile and emqx.conf's own comment) - EMQX's
# *native* TLS listener (port 8084) is deliberately unused, so this is
# not that port. Previously read `:8884` here, a typo for 8084 that was
# never reachable either way - fixed alongside the real TLS rollout
# rather than left as a stale placeholder.
relay.url=wss://relay.thrw.app/mqtt

# Keygen validation endpoint (services/licensing). Unused until the
# licensing wiring issue lands for this adapter; carried here so it never
# gets hardcoded.
licensing.url=https://licensing.thrw.app

selfHosted=false
