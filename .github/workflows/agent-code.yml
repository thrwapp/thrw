name: agent-code

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-code-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # required for GCP Workload Identity Federation

jobs:
  build:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    # claude-code-action / Claude Code CLI has no native per-run USD cap
    # (confirmed - no such flag exists as of this writing). The
    # max-budget-usd figures from the original plan (8 for Sonnet, 20 for
    # Opus) are approximated via the two real levers below: --max-turns
    # and this job's timeout-minutes, plus model choice itself. If you
    # want a real dollar-denominated backstop, set an org-level spend
    # limit in the Anthropic Console - there is no per-run equivalent.
    timeout-minutes: ${{ contains(github.event.issue.labels.*.name, 'model:opus') && 60 || 45 }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate thrw-agent App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_KEY }}

      # Guards against redundant `agent-ready` triggers on the same
      # issue - confirmed live on #101/#102 (2026-09-17): a burst of
      # `labeled` events on one issue (created with `agent-ready` already
      # in its labels array, then the label removed and re-added
      # shortly after) fired several real runs of this job for the same
      # issue within a minute of each other. `on.issues.types: [labeled]`
      # has no built-in dedup, and the `agent-code-<issue>` concurrency
      # group above only serializes duplicate runs - it doesn't skip
      # them. One run merged #104, closing #102; a second, independent
      # run kept going for another ~20 minutes and opened a second,
      # conflicting PR (#105) implementing the same issue after it was
      # already closed. Cheap to check up front: if the issue is already
      # closed, or already has an open or merged PR that would close it,
      # every later run for the same issue is redundant - skip before
      # spending a Claude Code turn on it.
      - name: Check for a duplicate trigger
        id: dup-check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          state="$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)"
          if [ "$state" = "CLOSED" ]; then
            echo "Issue #$ISSUE_NUMBER is already closed - skipping (duplicate trigger)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_pr="$(gh issue view "$ISSUE_NUMBER" --json closedByPullRequestsReferences \
            --jq '[.closedByPullRequestsReferences[] | select(.state == "OPEN" or .state == "MERGED")] | first | .url // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Issue #$ISSUE_NUMBER already has a PR that would close it ($existing_pr) - skipping (duplicate trigger)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

      # Will fail until WIF_PROVIDER / GCP_PROJECT_AI secrets exist - expected
      # at this stage. Assumes a service account named
      # agent-pipeline@<project>.iam.gserviceaccount.com; adjust to match
      # whatever name you actually create during GCP setup.
      - name: Authenticate to GCP
        if: steps.dup-check.outputs.should_run == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: agent-pipeline@${{ secrets.GCP_PROJECT_AI }}.iam.gserviceaccount.com

      - uses: pnpm/action-setup@v4
        if: steps.dup-check.outputs.should_run == 'true'
      - uses: actions/setup-node@v4
        if: steps.dup-check.outputs.should_run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.dup-check.outputs.should_run == 'true'

      - name: Run Claude Code
        id: run
        if: steps.dup-check.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          # This job only ever runs off a `labeled` event, and that label
          # is always applied by agent-triage.yml running as the
          # thrw-agent App - so the actor here is always a bot, never a
          # human. claude-code-action refuses to run for a bot actor by
          # default (its own anti-loop guard) unless explicitly allowed.
          # Confirmed live: the action failed outright with "Workflow
          # initiated by non-human actor: thrw-agent (type: Bot)" on the
          # first real run after the App-token labeling fix.
          allowed_bots: "thrw-agent[bot]"
          # TEMPORARY: bypassing Vertex entirely via Anthropic's own
          # workload identity federation (no static API key - the same
          # GitHub OIDC token this job already requests via id-token:
          # write, just exchanged with Anthropic instead of GCP).
          # Needed because both claude-sonnet-5 and claude-opus-5 are
          # confirmed 429 RESOURCE_EXHAUSTED on thrw-ai's Vertex quota
          # (a real quota increase is pending). Revert to use_vertex:
          # "true" (and drop the four anthropic_* lines below) once
          # that quota is approved - the "Authenticate to GCP" step
          # above is left in place, unused, to make that revert a
          # one-line change.
          use_vertex: "false"
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # Temporary (3rd occurrence this pipeline): federation itself
          # authenticated correctly ("Workload identity federation
          # configured (rule: fdrl_...)") but the run still failed
          # instantly (1 turn, ~750ms, $0 cost, is_error:true) with the
          # real error hidden by this input's own default. Need to see
          # it before guessing. Revert once a run actually succeeds.
          show_full_output: "true"
          prompt: |
            Follow CLAUDE.md and AGENTS.md in this repository.

            Implement the linked issue: #${{ github.event.issue.number }}

            ${{ github.event.issue.body }}

            Steps:
            0. Before changing anything, run
               `gh issue view ${{ github.event.issue.number }} --json state,closedByPullRequestsReferences`.
               If the issue is already CLOSED, or already has another
               open or merged PR in `closedByPullRequestsReferences`,
               stop immediately without making any change - a sibling
               run already handled this issue (the job-level dup-check
               only catches this at start-up, not a sibling that
               finishes while you're still working). Comment on the
               issue noting which PR already closed it, and finish
               without opening a new one.
            1. Read the issue's acceptance criteria and the package/service
               path it targets.
            2. Implement the change.
            3. Run the exact test command the issue specifies (or
               `pnpm turbo test --filter=<pkg>` for the target package) and
               confirm it passes.
            4. Write docs/handoffs/${{ github.event.issue.number }}.md in the
               branch describing what was done and what's uncertain, per
               AGENTS.md's definition of done. Use exactly this path (the
               issue number, not a shared HANDOFF.md) - a shared file caused
               constant merge conflicts between concurrently-developed
               agent branches.
            5. Open a pull request with `gh pr create`, citing file+line
               evidence for every acceptance criterion in the PR body.
               The PR body MUST include the literal line `Closes #${{ github.event.issue.number }}`
               (a GitHub auto-close keyword, not just prose like
               "Implements #N") so the linked issue closes automatically
               when this PR merges - confirmed live: PRs #25/#30/#43 all
               used "Implements #N" phrasing, which GitHub does not
               recognize, so issues #24/#29/#41 stayed open and
               `agent-ready`-labeled indefinitely after their PRs merged,
               making completed work look unpicked-up.
            6. Immediately run `gh pr merge --auto --squash` on the PR you
               just opened. This is required, not optional: packages/**
               is meant to auto-merge on green CI + a passing evaluator
               with no human clicking anything (AGENTS.md's scope
               section) - skipping this step leaves the PR sitting idle
               until a human manually enables auto-merge, defeating the
               point. For services/** PRs this is still safe to run: the
               branch ruleset's CODEOWNERS requirement holds the actual
               merge until a human reviews it regardless of auto-merge
               being enabled.

            If you hit AGENTS.md's stop conditions (5 failed test-fix
            cycles, or genuine ambiguity), stop, comment on the issue, and
            add the needs-human label instead of continuing.
          claude_args: |
            --model ${{ contains(github.event.issue.labels.*.name, 'model:opus') && 'claude-opus-5' || 'claude-sonnet-5' }}
            --max-turns ${{ contains(github.event.issue.labels.*.name, 'model:opus') && 100 || 90 }}
            --allowedTools "Read,Edit,Write,Bash(pnpm *),Bash(git *),Bash(gh *)"
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.GCP_PROJECT_AI }}
          CLOUD_ML_REGION: ${{ vars.GCP_VERTEX_REGION }}

      # Distinct from the graceful stop-condition path above (the agent
      # itself commenting + labeling before finishing normally, which
      # never marks this step as failed). A hard kill - max-turns
      # exceeded, or an execution/API error - leaves nothing on the issue
      # at all, since the agent never gets a chance to run its own `gh`
      # commands. Confirmed live on issue #40: two separate runs died on
      # max-turns (once at the 60-turn cap, again at 90 after that bump)
      # with zero trace on the issue itself, only visible by digging into
      # the Actions log. Same silent-failure class already fixed in
      # agent-eval.yml's "Flag evaluator infra failure" step - mirrors it
      # here.
      - name: Flag agent-code failure
        if: always() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Agent-code run failed before opening a PR (e.g. turn budget exceeded, or an execution error) — this issue may need to be split into smaller pieces or handed to a human. See the run log: %s\n' "$RUN_URL" > /tmp/agent-code-failure-body.md
          gh issue comment "$ISSUE_URL" --body-file /tmp/agent-code-failure-body.md
          gh issue edit "$ISSUE_URL" --add-label needs-human
