name: codeowners-gate

# Enforces AGENTS.md's human-merge rule, which CODEOWNERS alone does not
# (#181).
#
# `main-trunk-protection` already sets `require_code_owner_review: true`,
# but with `required_approving_review_count: 0` that rule never blocks
# anything - a PR satisfies "reviews" with no reviews at all, so the
# code-owner requirement never gets a chance to apply. Three PRs merged
# straight through it, including one touching `services/**` and one
# touching `docs/adr/**`, which AGENTS.md calls "always human-merge, no
# exceptions".
#
# Raising the approval count to 1 would fix that, but it applies to every
# PR and so removes the `packages/**` / `content/site/**` auto-merge lane
# AGENTS.md deliberately grants ("no human review required by default").
# Rulesets cannot condition the pull_request rule on changed paths, so
# this job is the only way to satisfy both halves of the contract: the
# fast lane stays open, and the protected paths genuinely require a
# code-owner approval.
#
# "Requires a code owner" means approved by one, OR opened by one. With a
# single code owner those are the same human, and GitHub forbids
# self-approval, so demanding the former alone makes the rule
# unsatisfiable for anything that human writes themselves. Agent PRs come
# from the thrw-agent App and are unaffected - they still need a real
# approval. See the exemption's own comment below.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # An approval must be able to turn this check green without a push.
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]

concurrency:
  # pull_request.number is undefined under merge_group - fall back to the
  # merge group's own head sha, same as ci.yml.
  group: codeowners-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # No job-level `if` here on purpose. A required check that skips reports
  # as "skipped" and leaves the merge queue stuck on "Expected - waiting"
  # forever - the trap ci.yml's own comment documents, and which has
  # already bitten agent-eval.yml once. This job always runs and decides
  # internally.
  codeowners-gate:
    name: codeowners-gate
    runs-on: ubuntu-latest
    steps:
      # Only .github/CODEOWNERS is read below, so a full-history clone
      # buys nothing. The changed-file list comes from the API now, not
      # from a local diff - see the step's own comment.
      - uses: actions/checkout@v4

      - name: Check code-owner approval for protected paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "merge_group: the gate already passed on the PR to get here."
            exit 0
          fi

          # The PR's own file list, from the API - deliberately NOT a
          # local `git diff BASE_SHA HEAD_SHA`, which is what this job
          # used to do and which was wrong. `pull_request.base.sha` is
          # the *current tip* of the base branch, not the merge base, so
          # a two-dot diff against it reports everything main gained
          # since the branch point as though this PR had changed it. A
          # docs-only PR was blocked for "touching"
          # .github/workflows/codeowners-gate.yml - a file added to main
          # by the PR that created this very job, which the branch had
          # simply not caught up to yet. Every PR that falls behind main
          # hit this, and the busier the repo the more often.
          #
          # `git diff BASE...HEAD` (three-dot, i.e. from the merge base)
          # would also be correct. The API is used instead because it is
          # the same list GitHub shows on the Files tab, so what the gate
          # enforces and what a human reviews can never diverge.
          CHANGED=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[].filename')
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          python3 - "$CHANGED" <<'PY' > protected.txt
          import sys
          changed = [f for f in sys.argv[1].splitlines() if f.strip()]
          # AGENTS.md's human-merge rules, deliberately restated here
          # rather than read from CODEOWNERS: AGENTS.md is the contract,
          # and CODEOWNERS is currently *narrower* than it (see the
          # pricing note below), so parsing CODEOWNERS would enforce less
          # than the contract promises.
          def protected(path: str) -> bool:
              return (
                  path.startswith("services/")
                  or path.startswith(".github/")
                  or path.startswith("docs/adr/")
                  # AGENTS.md: "any file whose path contains `pricing`".
                  # Broader than CODEOWNERS' content/site/src/pages/pricing*.
                  or "pricing" in path
              )
          for f in changed:
              if protected(f):
                  print(f)
          PY

          if [ ! -s protected.txt ]; then
            echo "No protected paths touched - the packages/** fast lane applies."
            exit 0
          fi

          echo "Protected paths touched:"
          sed 's/^/  /' protected.txt

          OWNERS=$(grep -ohE '@[A-Za-z0-9._-]+' .github/CODEOWNERS | tr -d '@' | sort -u)
          echo "Code owners: $(echo "$OWNERS" | tr '\n' ' ')"

          # A PR opened by a code owner satisfies the rule by being
          # opened by them: AGENTS.md asks that protected paths get a
          # human in the loop, and with a single code owner that human
          # is the author. GitHub forbids approving your own PR, so
          # without this the rule is literally unsatisfiable for anything
          # Tom writes himself - and the ruleset sets
          # current_user_can_bypass: never, so there is no admin door
          # either. That deadlock is what this exemption fixes.
          #
          # This does NOT reopen #181. Agent PRs are opened by the
          # thrw-agent GitHub App (agent-code.yml mints an App token),
          # so their author is a bot, never a code owner, and they still
          # need a real approval. The Bot guard below makes that
          # explicit rather than relying on the App never sharing a
          # login with a code owner.
          if [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
            echo "Author @$PR_AUTHOR is a bot - no author exemption."
          else
            for owner in $OWNERS; do
              if [ "$(printf '%s' "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')" \
                 = "$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')" ]; then
                echo "Opened by code owner @$PR_AUTHOR - a human owns this PR."
                exit 0
              fi
            done
          fi

          APPROVERS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq '.[] | select(.state == "APPROVED") | .user.login' | sort -u || true)
          echo "Approved by: ${APPROVERS:-(nobody)}"

          for owner in $OWNERS; do
            if echo "$APPROVERS" | grep -qix "$owner"; then
              echo "Approved by code owner @$owner."
              exit 0
            fi
          done

          echo
          echo "::error::This PR touches paths AGENTS.md marks human-merge, was not opened by a code owner, and has no code-owner approval."
          echo "Approve it as one of: $(echo "$OWNERS" | tr '\n' ' ')"
          exit 1
