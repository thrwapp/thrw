name: release

# Builds the artifacts that have no workflow of their own, and defines how
# every tag-triggered workflow shares one GitHub Release (#190).
#
# ## One tag, one Release, several workflows
#
# A `v*` tag starts more than one workflow - this one and
# `release-android.yml` and `release-mac.yml` (#189). They all
# attach assets to the same Release, and GitHub Actions gives no ordering
# between them, so whichever runs first would otherwise decide whether the
# Release is a draft.
#
# The contract, which every publisher must follow: **look for a release
# for this tag; create it as a draft only if there is none; then upload
# into it.**
#
#     gh release view "$tag" >/dev/null 2>&1 \
#       || gh release create "$tag" --draft --notes ... || true
#     gh release upload "$tag" <asset> --clobber
#
# The earlier form of this contract was `create ... || upload`, on the
# assumption that a second `create` fails because the tag is taken. **It
# does not.** GitHub enforces tag uniqueness only for *published*
# releases; `create --draft` on a tag that already has a draft happily
# makes a second one. v0.0.1 - the first tag ever cut - ended up with two
# drafts, the linux artifact in one and the Android artifacts in the
# other, each invisible from the other's page.
#
# The residual race (two publishers both seeing "none" and both creating)
# is narrowed by a few seconds of jitter, for the same reason ADR 0020
# applies jitter to reconnects: decorrelate actors that a single event
# started simultaneously. It is not eliminated. Duplicates are visible as
# two drafts with the same tag in `gh api repos/:owner/:repo/releases`,
# and the fix is to delete one and re-upload - drafts are free.
#
# Assets are renamed **on disk** before upload. `path#suffix` sets an
# asset *label*, not its filename: v0.0.1 attached `app-release.apk`
# while its notes told the reader to install `thrw-v0.0.1.apk`.
#
# A new platform publisher (#189) copies that pattern rather than reaching
# for `softprops/action-gh-release`, whose default is a *published*
# release. Mixing the two is what made this need fixing: the placeholder
# jobs removed below used softprops while `release-android.yml` created a
# draft, so the Release's state depended on a race.
#
# ## What was removed here, and why
#
# The `mac` and `android` jobs were Fastlane placeholders that wrote a
# line of text into a file and attached it to the Release. Next to a real
# signed bundle, with nothing marking which was which.
#
# Worse, `mac` ran on `[self-hosted, macOS]` and this repository has **no
# self-hosted runners registered at all** - so that job never started, and
# `announce` (which needed it) never ran either. The release workflow has
# never been able to complete. `ci.yml` builds Swift on `macos-14`; that
# is the label #189 should use.
#
# Their TODOs described a Gemfile and Fastfile that were never written.
# The real Android lane is `release-android.yml`, and the Mac lane will be
# its own workflow (#189) rather than a job here - per-platform workflows,
# matching what already exists and works.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the Release and upload assets

# Which workflow builds what, so one tag produces one coherent Release
# (#190):
#
# - **Android** is built by `release-android.yml`, which produces a real
#   signed bundle and attaches it to this same Release. It is not built
#   here. Before #190 a tag ran *two* Android jobs, and the one here
#   attached `thrw-android-<tag>.txt` - a file whose entire contents were
#   "TODO: fastlane android release lane not yet implemented." - to the
#   same Release as the signed artifact, with nothing marking which was
#   which.
#
# - **macOS** is built by `release-mac.yml` (#189), on `macos-14`, and is
#   not built here. The job that used to sit here could never have run:
#   it required `[self-hosted, macOS]` and this repository has **no
#   self-hosted runners registered**, so on the first real tag it would
#   have queued until the job timeout and taken `announce` - which
#   depended on it - down with it. Removing it is what makes a tag
#   complete at all.
#
# - **Linux** is built here, and is real work.
#
# The Fastlane TODOs that used to be here have gone with the jobs: there
# is no Gemfile or Fastfile anywhere in the repository, so they described
# a plan nobody took up, and a comment pointing at a project that does
# not exist is worse than no comment.
#
# Known race, stated rather than papered over: `announce` can only depend
# on jobs in *this* workflow, so it may run before `release-android.yml`
# has finished attaching the bundle. GitHub Actions has no cross-workflow
# dependency, and the alternatives (polling the Release, merging the two
# workflows) cost more than the problem is worth while releases are
# hand-cut.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo build --release
        working-directory: packages/adapter-linux
        run: cargo build --release

      # The shared-Release contract from this file's header. `gh` is
      # preinstalled on the runner, so this needs no third-party action -
      # the same reasoning release-android.yml's own attach step gives.
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob
          # Glob everything cargo produced, then drop the dep-file.
          # `libadapter_linux.*` on its own also matched
          # `libadapter_linux.d` - cargo's build metadata - which the
          # previous version of this step attached to the Release as
          # though it were an artifact. Filtering rather than listing
          # extensions explicitly keeps nullglob doing its job (a word
          # with no wildcard is not a pattern, so an explicit list would
          # hand `gh` paths that do not exist) and still picks up a
          # future crate-type change to .so or .a.
          out=packages/adapter-linux/target/release
          assets=()
          for f in "$out"/libadapter_linux.*; do
            case "$f" in
              *.d) continue ;;
            esac
            assets+=("$f")
          done
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::cargo build produced no libadapter_linux artifact to attach."
            exit 1
          fi
          # Ensure exactly one draft exists for this tag, then upload into
          # it - see this file's header for why `create || upload` was
          # wrong. Drafts are not unique by tag, so the old form made a
          # second draft instead of failing.
          sleep $((RANDOM % 7))
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --notes "Adapter artifacts for $tag. Draft until a human publishes it." \
              --draft || true
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
