name: agent-eval

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]

concurrency:
  # pull_request.number is undefined under merge_group - fall back to the
  # merge group's own head sha so concurrent PRs/queue entries don't
  # collide on an empty group key and cancel each other.
  group: agent-eval-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write # required for GCP Workload Identity Federation

jobs:
  # No job-level `if` here on purpose: "agent-eval / evaluate" is a required
  # status check (Prompt 4's branch ruleset). A job skipped via a job-level
  # `if` never posts a status at all, which leaves a required check stuck
  # "expected" forever and blocks every non-agent PR from merging - this bit
  # us on the very first real PR after the ruleset went live. Instead the
  # job always runs; only the real work is step-conditional, so the job
  # trivially succeeds (and the check reports green) on PRs the evaluator
  # doesn't apply to.
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # not specified in the original plan; a safety net sized to --max-turns 25 below
    steps:
      # merge_group runs carry no `pull_request` object at all (a different
      # event shape, not just a missing field) - checking event_name first
      # rather than relying on an implicit null comparison under it.
      - name: Skip - not a pull_request run from the agent
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.user.login != 'thrw-agent[bot]'
        run: echo "Not a pull_request event from thrw-agent[bot]; nothing to evaluate."

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'thrw-agent[bot]'
        with:
          fetch-depth: 0 # need main's history to compare test counts

      # Labels applied with the default GITHUB_TOKEN don't trigger other
      # workflow runs (a deliberate GitHub Actions anti-recursion guard -
      # confirmed live in agent-triage.yml, see its comment). Nothing
      # currently listens for needs-human being added, but use the same
      # App token as agent-triage.yml/agent-code.yml for consistency and
      # so it's not a landmine for whatever eventually does.
      - name: Generate thrw-agent App token
        id: app-token
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'thrw-agent[bot]'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_KEY }}

      # Will fail until WIF_PROVIDER / GCP_PROJECT_AI secrets exist - expected
      # at this stage. Reuses the same agent-pipeline service account as
      # agent-triage.yml / agent-code.yml.
      - name: Authenticate to GCP
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'thrw-agent[bot]'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: agent-pipeline@${{ secrets.GCP_PROJECT_AI }}.iam.gserviceaccount.com

      - uses: pnpm/action-setup@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'thrw-agent[bot]'
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'thrw-agent[bot]'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'thrw-agent[bot]'

      # --json-schema needs the schema content itself, not a file path -
      # confirmed live: passing the path directly failed with "--json-schema
      # is not valid JSON: JSON Parse error: Unexpected token '.'" (the SDK
      # layer claude-code-action uses parses the value as literal JSON
      # immediately, unlike the bare `claude` CLI's own file-path support).
      # Reading it into a step output here keeps the schema file itself as
      # the single source of truth instead of duplicating it inline.
      - name: Load agent-eval JSON schema
        id: schema
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'thrw-agent[bot]'
        run: echo "json=$(jq -c . .github/schemas/agent-eval-result.schema.json)" >> "$GITHUB_OUTPUT"

      - name: Run evaluator
        id: eval
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'thrw-agent[bot]'
        uses: anthropics/claude-code-action@v1
        with:
          # This step only ever runs for a PR opened by thrw-agent[bot]
          # (see the `if` above), so the triggering actor is always
          # that bot - the same non-human-actor rejection agent-code.yml
          # hit applies here too, just never exercised yet since no
          # agent-code run has ever succeeded in opening a real PR.
          # Added proactively rather than waiting to discover it live.
          allowed_bots: "thrw-agent[bot]"
          # TEMPORARY: see agent-code.yml's matching comment - bypassing
          # Vertex via Anthropic's own workload identity federation
          # while a Vertex quota increase for thrw-ai is pending.
          use_vertex: "false"
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # Temporary diagnostic: PR #35's evaluate run hit error_max_turns
          # (26 turns, permission_denials_count: 14) - the first PR whose
          # own claims span build+typecheck+test (content/site's test
          # depends on its own build via turbo, and criterion 2 makes a
          # specific "astro check runs with zero errors" claim), not just
          # a bare test run. allowedTools only permits `Bash(pnpm test *)`,
          # which doesn't match `pnpm turbo build typecheck test ...` or a
          # standalone typecheck/build command the evaluator would need to
          # independently verify those claims. Re-enabling to see the
          # actual denied commands before touching allowedTools - don't
          # guess the fix.
          show_full_output: "true"
          prompt: |
            You are grading pull request #${{ github.event.pull_request.number }},
            opened by the agent.

            Your working directory is ALREADY checked out at this PR's
            merge commit (actions/checkout's default ref for a
            pull_request event) - the files on disk right now are the
            PR's own proposed changes, not main. Do not run `git fetch
            origin pull/N/head`, `gh api repos/.../contents/...`, or any
            other attempt to fetch the PR's content separately - none of
            that is in your allowed tools anyway, and it's redundant work.
            Just `Read` the files directly, and use `git diff
            main...HEAD` (already allowed) if you want an explicit diff
            view. Confirmed live on PR #30: without this, the evaluator
            burned most of a 25-turn budget on repeated denied
            git-fetch/gh-api attempts before eventually falling back to
            reading the local checkout directly - it happened to still
            finish in time that once, but shouldn't have needed to.

            The PR's own description already lists every acceptance
            criterion under "Acceptance criteria evidence", each with the
            agent's claimed file+line citation - use `gh pr view
            ${{ github.event.pull_request.number }} --json body` to read
            it. Do not try to fetch a separate linked issue: `gh issue *`
            isn't in your allowed tools, and every other workaround
            (`curl`, `git log --all`, `gh repo view`) is also blocked -
            confirmed live, this burned all 25 turns on issue #24/PR #25's
            first real evaluation without ever reaching the tests.

            Treat every acceptance criterion as FAIL by default. You may
            only mark one PASS if you independently verify the cited
            file+line evidence against this PR's actual diff - never take
            the PR description's own claims at face value.

            Run the tests yourself (read-only: `pnpm test`/`pnpm turbo
            test` variants only) and confirm the total test count did not
            decrease versus main.

            Output your result as JSON matching the provided schema.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 25
            --allowedTools "Read,Bash(pnpm test *),Bash(git diff *),Bash(gh pr *)"
            --json-schema '${{ steps.schema.outputs.json }}'
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.GCP_PROJECT_AI }}
          CLOUD_ML_REGION: ${{ vars.GCP_VERTEX_REGION }}

      - name: Act on evaluation result
        if: always() && steps.eval.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RESULT: ${{ steps.eval.outputs.structured_output }}
        run: |
          echo "$RESULT" | jq .
          overall_pass=$(echo "$RESULT" | jq -r '.overall_pass')

          if [ "$overall_pass" != "true" ]; then
            echo "$RESULT" | jq -r '"## Evaluator result\n\n" + (.criteria | map("- [" + (if .pass then "x" else " " end) + "] " + .criterion + " - " + .evidence) | join("\n")) + "\n\n" + .notes' \
              > /tmp/eval-review-body.md
            gh pr review "$PR_URL" --request-changes --body-file /tmp/eval-review-body.md
            gh issue edit "$PR_URL" --add-label needs-human
          fi
