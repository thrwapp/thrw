name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "content/site/**"

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm turbo build --filter=@thrw/site

      # Will fail until CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets
      # and the CLOUDFLARE_PAGES_PROJECT variable exist - expected at this
      # stage. None of these are things an agent can create: they require a
      # Cloudflare account, a Pages project, and an API token generated by a
      # human in the Cloudflare dashboard. Set:
      #   - secrets.CLOUDFLARE_API_TOKEN: an API token scoped to
      #     "Cloudflare Pages — Edit" for the target account
      #   - secrets.CLOUDFLARE_ACCOUNT_ID: the Cloudflare account ID
      #   - vars.CLOUDFLARE_PAGES_PROJECT: the Pages project name (create it
      #     once via the dashboard or `wrangler pages project create`)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: content/site/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
