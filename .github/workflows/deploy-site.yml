name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "content/site/**"
  # Re-running a completed workflow run replays the workflow file as it
  # existed at that run's original commit, not the current tip of main -
  # confirmed live: re-running the failed run from before the
  # deployments:write fix (run 35144959906) reproduced the identical 403,
  # because the rerun never picked up the fix at all. workflow_dispatch
  # lets a fresh run be fired against the current workflow file without
  # waiting for another content/site/** push.
  workflow_dispatch: {}

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm turbo build --filter=@thrw/site

      # Confirmed live on the first real run (PR #50's merge, run 35134374618):
      # secrets/vars were already correctly set, the build succeeded, but
      # cloudflare/pages-action still failed - it also creates a GitHub
      # Deployment via the REST API (POST /repos/.../deployments) using
      # gitHubToken below, which needs the `deployments: write` permission.
      # This job's permissions block only granted `contents: read`, so the
      # default GITHUB_TOKEN got a 403 "Resource not accessible by
      # integration" (response header named the missing scope explicitly:
      # x-accepted-github-permissions: deployments=write). Added above.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: content/site/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
