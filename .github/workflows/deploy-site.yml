name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "content/site/**"
  # Re-running a completed workflow run replays the workflow file as it
  # existed at that run's original commit, not the current tip of main -
  # confirmed live: re-running the failed run from before the
  # deployments:write fix (run 35144959906) reproduced the identical 403,
  # because the rerun never picked up the fix at all. workflow_dispatch
  # lets a fresh run be fired against the current workflow file without
  # waiting for another content/site/** push.
  workflow_dispatch: {}

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm turbo build --filter=@thrw/site

      # Was `cloudflare/pages-action@v1` until #233. Cloudflare archived
      # that action and its repository now 404s, so it stopped resolving -
      # and action resolution happens before any step runs, so the job
      # failed at "Set up job" on a workflow file nobody had touched since
      # 18 September. `wrangler-action` running `pages deploy` is the
      # migration Cloudflare documents.
      #
      # Two hard-won details survive the swap unchanged:
      #
      # `workingDirectory: content/site`, not the repo root. Wrangler Pages
      # looks for a `functions/` directory relative to its own cwd, not
      # relative to the output directory. The original config ran from the
      # repo root with `directory: content/site/dist`, so it looked for
      # ./functions at the root, found none, and silently never deployed
      # content/site/functions/waitlist.ts at all. The live symptom: POSTing
      # to /waitlist got Cloudflare's default 404 (HTML, not JSON), which
      # the client's `.json().catch(() => ({}))` swallowed into the generic
      # "Something went wrong" message. `dist` in the command below is
      # relative to this directory, so it and functions/ both resolve
      # against content/site.
      #
      # `gitHubToken`, and `deployments: write` in the permissions block
      # above. This action also creates a GitHub Deployment via
      # POST /repos/.../deployments, which 403s without that scope -
      # confirmed live on PR #50's merge (run 35134374618), where the
      # response header named the missing scope outright:
      # x-accepted-github-permissions: deployments=write.
      #
      # packageManager: pnpm per AGENTS.md - it is what fetches wrangler.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: content/site
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
