name: deploy

on:
  push:
    branches: [main]
    paths:
      - "packages/relay-core/**"
      - "services/relay-hosted/**"
      - "services/licensing/**"
  # Re-running a completed workflow run replays the workflow file as it
  # existed at that run's original commit, not the current tip of main -
  # confirmed on deploy-site.yml (see its matching comment). workflow_dispatch
  # lets a fresh run be fired manually once the relay VM actually exists,
  # without needing another push to a watched path.
  workflow_dispatch: {}

concurrency:
  group: deploy-relay
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Will fail until WIF_PROVIDER / GCP_PROJECT_PROD secrets exist -
      # expected at this stage. Assumes a service account named
      # deploy@<project>.iam.gserviceaccount.com; adjust to match whatever
      # name you actually create during GCP setup.
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: deploy@${{ secrets.GCP_PROJECT_PROD }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_ARTIFACT_REGISTRY_REGION || 'us-central1' }}-docker.pkg.dev" --quiet

      - name: Build and push relay image
        env:
          IMAGE: ${{ vars.GCP_ARTIFACT_REGISTRY_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_PROD }}/thrw/relay
        run: |
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" services/relay-hosted
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      # gcloud compute instances update-container / create-with-container
      # (Container-Optimized OS + the container-startup-agent) is
      # discontinued - confirmed live, a real create-with-container attempt
      # was refused outright ("the option to deploy a container during VM
      # instance creation that relies on a container startup agent is
      # discontinued"). The relay VM is a plain Debian image with Docker
      # installed via startup script instead (docs/ops/prompt-5-...md), so
      # rolling a new image means SSHing in and running Docker directly -
      # see scripts/relay-redeploy.sh for what actually runs on the VM.
      # Needs the deploy service account to have roles/iap.tunnelResourceAccessor
      # (for --tunnel-through-iap) and a firewall rule allowing tcp:22 from
      # IAP's range (35.235.240.0/20) to the relay VM.
      # EMQX_RELAY_USERNAME/PASSWORD: the shared relay MQTT credential
      # services/relay-hosted/docker-entrypoint-relay.sh requires at
      # container start (see docs/handoffs/80.md) - confirmed live, the
      # container crash-looped without them ("EMQX_RELAY_USERNAME must be
      # set"). Must exist as repo secrets before this step can succeed;
      # base64-encoded here (and decoded inside relay-redeploy.sh) purely
      # to survive two layers of shell quoting (this run block, then
      # --command's own string) regardless of what characters the actual
      # credential contains.
      - name: Roll the relay VM
        env:
          IMAGE: ${{ vars.GCP_ARTIFACT_REGISTRY_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_PROD }}/thrw/relay
          ARTIFACT_HOST: ${{ vars.GCP_ARTIFACT_REGISTRY_REGION || 'us-central1' }}-docker.pkg.dev
          RELAY_VM_NAME: ${{ vars.GCP_RELAY_VM_NAME || 'thrw-relay' }}
          RELAY_ZONE: ${{ vars.GCP_RELAY_ZONE || 'us-central1-a' }}
        run: |
          gcloud compute scp scripts/relay-redeploy.sh "${RELAY_VM_NAME}:/tmp/relay-redeploy.sh" \
            --zone="$RELAY_ZONE" --project="${{ secrets.GCP_PROJECT_PROD }}" --tunnel-through-iap

          EMQX_USER_B64=$(printf '%s' "${{ secrets.EMQX_RELAY_USERNAME }}" | base64 -w0)
          EMQX_PASS_B64=$(printf '%s' "${{ secrets.EMQX_RELAY_PASSWORD }}" | base64 -w0)

          gcloud compute ssh "$RELAY_VM_NAME" \
            --zone="$RELAY_ZONE" --project="${{ secrets.GCP_PROJECT_PROD }}" --tunnel-through-iap \
            --command="sudo bash /tmp/relay-redeploy.sh '${IMAGE}:${{ github.sha }}' '$ARTIFACT_HOST' '$EMQX_USER_B64' '$EMQX_PASS_B64'"

      # A fully-configured EMQX boot (auth bootstrap file, ACL, disabled
      # listeners per emqx.conf) is slower than the bare default image the
      # original 5-attempt/5s window was sized against - confirmed live,
      # that window wasn't even enough to tell "still starting" apart from
      # "crashed" during the first credentialed rollout. Widened for
      # margin; scripts/health-check-or-rollback.sh already reads these.
      - name: Health check
        env:
          MAX_ATTEMPTS: "12"
          SLEEP_SECONDS: "10"
        run: ./scripts/health-check-or-rollback.sh "${{ vars.RELAY_HEALTH_URL }}"
