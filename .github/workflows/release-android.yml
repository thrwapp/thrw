name: release-android

# Builds a *signed* Android App Bundle and attaches it to a GitHub Release
# for manual upload to Play Console (#153).
#
# Deliberately build-only: auto-uploading to Play needs a Google Cloud
# service account with Play Console access plus a third-party action, which
# isn't worth the dependency until releases are frequent enough to be a
# chore. Revisit when that's true.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: write # creating the Release and uploading its asset

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count (below), which a shallow clone
          # would compute wrong - and wrong low, so it would collide with a
          # value Play has already burned.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same hand-rolled install as ci.yml's `android` job, for the same
      # reason: it pins the exact platform/build-tools versions
      # app/build.gradle.kts declares rather than trusting a third-party
      # setup action's defaults (AGENTS.md: no new dependency without
      # justification). If compileSdk or build-tools change there, these
      # arguments need updating to match - and so does ci.yml's copy.
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > packages/adapter-android/local.properties

      # Commit count rather than github.run_number: it's reproducible
      # locally (`git rev-list --count HEAD` gives the same answer), traces
      # back to a specific commit, and doesn't reset if this workflow file
      # is ever renamed or recreated - which would silently restart the
      # sequence at 1 and collide with values Play has already burned.
      - name: Derive versionCode
        id: version
        run: |
          code="$(git rev-list --count HEAD)"
          echo "Derived versionCode: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.THRW_PLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::THRW_PLAY_KEYSTORE_BASE64 is not set. Without it the build" \
                 "would still succeed and produce an *unsigned* bundle (by design - see" \
                 "app/build.gradle.kts), which Play rejects. Failing early instead."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # #187. Without this the build reads the committed
      # config/adapter.properties, which ships the credential deliberately
      # empty (#147), generates RELAY_USERNAME = "" / RELAY_PASSWORD = "",
      # and produces an artifact that installs and is then rejected at
      # connect with badUserNameOrPassword - the deployed broker runs
      # allow_anonymous=false (#80/#93). That is the worst kind of
      # failure: it looks like a successful release and fails later, far
      # from the cause.
      #
      # Reuses EMQX_RELAY_USERNAME/PASSWORD - the same shared relay
      # credential deploy.yml gives the relay container - rather than
      # introducing a second secret holding the same value. Two copies
      # drift: rotating the relay password would update one and not the
      # other, leaving a working relay and newly-built adapters that all
      # fail auth, which reads as an adapter bug nowhere near its cause.
      # Per-identity credentials are M7 (services/accounts); that is the
      # point to split them, along with the ACL change that makes it
      # meaningful.
      - name: Write relay credentials
        env:
          RELAY_USERNAME: ${{ secrets.EMQX_RELAY_USERNAME }}
          RELAY_PASSWORD: ${{ secrets.EMQX_RELAY_PASSWORD }}
        run: |
          if [ -z "$RELAY_USERNAME" ] || [ -z "$RELAY_PASSWORD" ]; then
            echo "::error::EMQX_RELAY_USERNAME/EMQX_RELAY_PASSWORD are not set." \
                 "Without them this build would still succeed and produce an" \
                 "artifact that cannot authenticate against the relay (#187)." \
                 "Failing early instead."
            exit 1
          fi
          # Written with printf rather than a heredoc so the value is never
          # echoed, and mode 600 before anything is in it.
          overlay=packages/adapter-android/config/adapter.local.properties
          install -m 600 /dev/null "$overlay"
          printf 'relay.username=%s\n' "$RELAY_USERNAME" >> "$overlay"
          printf 'relay.password=%s\n' "$RELAY_PASSWORD" >> "$overlay"
          echo "Wrote $overlay (gitignored, removed after the build)."

      # Both artifacts from one Gradle invocation, deliberately: they share
      # the generated build config (and so the relay credential written
      # above), the same keystore decode, and the same versionCode. Two
      # separate invocations could drift on any of those and produce an
      # `.aab` and an `.apk` that are not the same build.
      #
      # The `.aab` is Play's upload format - Play expands it into
      # per-device APKs and a phone cannot install one. The `.apk` is what
      # actually goes on the Pixel for internal testing (#188), which is
      # the whole point while there is no Play track yet.
      - name: Build signed bundle and APK
        working-directory: packages/adapter-android
        env:
          THRW_VERSION_CODE: ${{ steps.version.outputs.code }}
          THRW_PLAY_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          THRW_PLAY_KEYSTORE_PASSWORD: ${{ secrets.THRW_PLAY_KEYSTORE_PASSWORD }}
          THRW_PLAY_KEY_ALIAS: ${{ secrets.THRW_PLAY_KEY_ALIAS }}
          THRW_PLAY_KEY_PASSWORD: ${{ secrets.THRW_PLAY_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      # A green `bundleRelease` does NOT mean the bundle is signed: an
      # unconfigured build succeeds and produces an unsigned one on purpose.
      # So assert the signature explicitly rather than inferring it, or a
      # misconfigured secret ships a bundle Play silently rejects hours later.
      - name: Verify the bundle is signed
        run: |
          aab="packages/adapter-android/app/build/outputs/bundle/release/app-release.aab"
          if ! keytool -printcert -jarfile "$aab" > /tmp/cert.txt 2>&1; then
            echo "::error::Could not read a certificate from $aab"
            cat /tmp/cert.txt
            exit 1
          fi
          if ! grep -q "^Owner:" /tmp/cert.txt; then
            echo "::error::$aab is not signed - check the upload-key secrets"
            cat /tmp/cert.txt
            exit 1
          fi
          echo "Signed by:"
          grep -E "^(Owner|Valid from)" /tmp/cert.txt

      # Same reasoning as the bundle check above, but `apksigner` rather
      # than `keytool`: an APK can be signed with v1 (JAR), v2, v3 or v4,
      # and `keytool -printcert -jarfile` only sees v1. On a modern
      # minSdk, AGP may legitimately produce a v2/v3-only APK, which
      # keytool would report as unsigned - a false failure. `apksigner`
      # understands every scheme and is what the platform itself uses to
      # decide whether a package installs.
      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apk="packages/adapter-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::$apk was not produced by assembleRelease."
            exit 1
          fi
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::apksigner not found at $apksigner - the build-tools" \
                 "version installed above has changed without this step following."
            exit 1
          fi
          if ! "$apksigner" verify --print-certs "$apk" > /tmp/apk-certs.txt 2>&1; then
            echo "::error::$apk is not signed, or its signature does not verify -" \
                 "an unsigned APK will not install. Check the upload-key secrets."
            cat /tmp/apk-certs.txt
            exit 1
          fi
          echo "Signed by:"
          grep -E "certificate DN|Signer" /tmp/apk-certs.txt || cat /tmp/apk-certs.txt

      # Runs even if the build or verification failed, so key material never
      # outlives the job that needed it.
      # A green build does not prove the credential landed - the same
      # reasoning as "Verify the bundle is signed" above. Asserts on the
      # *generated* config, which is what actually ends up compiled in.
      - name: Verify the built config carries the credential
        env:
          RELAY_USERNAME: ${{ secrets.EMQX_RELAY_USERNAME }}
        run: |
          generated=packages/adapter-android/app/build/generated/source/adapterConfig/com/thrw/adapter/android/config/BuildConfig.kt
          if [ ! -f "$generated" ]; then
            echo "::error::$generated was not generated - the build config task did not run."
            exit 1
          fi
          username=$(sed -n 's/.*RELAY_USERNAME: String = "\(.*\)"$/\1/p' "$generated")
          password=$(sed -n 's/.*RELAY_PASSWORD: String = "\(.*\)"$/\1/p' "$generated")
          if [ -z "$username" ] || [ -z "$password" ]; then
            echo "::error::The generated config has an empty relay credential -" \
                 "this artifact could not authenticate (#187)."
            exit 1
          fi
          # Username only. The password is deliberately not compared: the
          # generator escapes for Java Properties *and* Kotlin, so a value
          # containing a backslash legitimately differs from the raw
          # secret (adapter.properties documents this asymmetry between
          # the two platforms). Comparing it would fail spuriously on a
          # rotation; the non-empty check above is what catches the actual
          # bug this issue is about.
          if [ "$username" != "$RELAY_USERNAME" ]; then
            echo "::error::The generated relay username does not match the secret."
            exit 1
          fi
          echo "Generated config carries a non-empty credential and the expected username."

      - name: Remove relay credentials
        if: always()
        run: rm -f packages/adapter-android/config/adapter.local.properties

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.code }}
          path: |
            packages/adapter-android/app/build/outputs/bundle/release/app-release.aab
            packages/adapter-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Only on a tag: a workflow_dispatch run has no version to release
      # against, and its bundle is available as the artifact above. `gh` is
      # preinstalled on the runner, so this needs no third-party action.
      #
      # The create-draft-or-upload shape below is the shared-Release
      # contract documented in release.yml's header (#190): a `v*` tag
      # starts several workflows with no ordering between them, and they
      # all attach to this one Release. Keep the two in step - a publisher
      # that creates a *published* release instead makes the outcome
      # depend on which workflow happens to win.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          code="${{ steps.version.outputs.code }}"
          aab=packages/adapter-android/app/build/outputs/bundle/release/app-release.aab
          apk=packages/adapter-android/app/build/outputs/apk/release/app-release.apk

          # Asset names say what each one is for. `app-release.aab` and
          # `app-release.apk` differ by one character, and picking the
          # wrong one means either a Play upload that fails or a download
          # that will not install - so the APK is named after the thing a
          # human is trying to do with it.
          #
          # Renamed on disk, NOT with `path#label`. v0.0.1 shipped an
          # asset called `app-release.apk` while the notes told the reader
          # to install `thrw-v0.0.1.apk`: the `#suffix` syntax sets an
          # asset *label* (UI description), it does not rename the file.
          staged="$RUNNER_TEMP/release-assets"
          mkdir -p "$staged"
          cp "$aab" "$staged/app-release.aab"
          cp "$apk" "$staged/thrw-$tag.apk"

          # Ensure exactly one draft exists for this tag, then upload into
          # it. NOT `create || upload`: that was the contract #190 wrote
          # and it is wrong for drafts. GitHub enforces tag uniqueness
          # only for *published* releases, so a second `create --draft`
          # succeeds and silently makes a SECOND draft - which is what
          # v0.0.1 did, leaving the linux artifact in one draft and the
          # Android ones in another, each invisible from the other.
          #
          # Residual race, stated rather than hidden: two workflows could
          # both see "no release" and both create. The jitter narrows it
          # (same reasoning as ADR 0020's reconnect jitter - decorrelate
          # publishers that were started by one event), and in practice
          # these jobs finish minutes apart. If duplicates ever do appear,
          # they are visible as two drafts with the same tag in
          # `gh api repos/:owner/:repo/releases`.
          sleep $((RANDOM % 7))
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --notes "Android artifacts for $tag (versionCode $code)." \
              --draft || true
          fi
          gh release upload "$tag" \
            "$staged/app-release.aab" \
            "$staged/thrw-$tag.apk" \
            --clobber

          # Set the notes unconditionally afterwards, rather than relying
          # on `create` above having been the one that ran. A `v*` tag
          # starts several workflows (#190) and whichever creates the
          # Release first sets its notes - so without this, the body a
          # human reads would depend on a race, and could be release.yml's
          # generic Linux text. `edit` is deterministic: `create` only
          # succeeds once, so this always wins.
          gh release edit "$tag" --notes "$(cat <<NOTES
          Android artifacts for \`$tag\` (versionCode $code).

          - **\`thrw-$tag.apk\`** - install this on a phone. Sideload:
            \`adb install thrw-$tag.apk\`, or copy it across and open it,
            granting "install unknown apps" to whatever opens it.
          - **\`app-release.aab\`** - Play Console upload format only. A
            phone cannot install this; Play expands it into per-device
            APKs.

          Both come from one build and carry the same versionCode and
          relay credential.
          NOTES
          )"
