name: agent-triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write # required for GCP Workload Identity Federation

jobs:
  # Cost-control default (Tom's explicit ask - agent-code.yml runs are the
  # real spend driver, real Claude turns, not triage itself: scripts/
  # triage.py below is a pure local heuristic with no API calls at all).
  # Every new issue defaults to `local-only` (never auto-picked-up)
  # unless it's marked `trivial` at creation time - `trivial` opts an
  # issue INTO the normal scoring/agent-ready flow below. `local-only`
  # always wins outright even if `trivial` is also present, since it's
  # the explicit "I'm doing this myself" override. Both labels are added
  # via the picker on GitHub's own "New issue" page at creation time, so
  # they're already present by the time this `opened` event fires - no
  # race with this job running first.
  triage:
    runs-on: ubuntu-latest
    steps:
      # Labels applied with the default GITHUB_TOKEN don't trigger other
      # workflow runs - a deliberate GitHub Actions anti-recursion guard,
      # confirmed live: agent-triage successfully applied agent-ready to
      # issue #5 using github.token, and agent-code.yml's `issues:
      # types: [labeled]` trigger never fired at all (zero runs). App
      # installation tokens aren't subject to that restriction, so use
      # the same thrw-agent App token agent-code.yml/agent-eval.yml
      # already authenticate with.
      - name: Generate thrw-agent App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_KEY }}

      - name: Decide whether to auto-triage or default to local-only
        id: decide
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          IS_LOCAL_ONLY: ${{ contains(github.event.issue.labels.*.name, 'local-only') }}
          IS_TRIVIAL: ${{ contains(github.event.issue.labels.*.name, 'trivial') }}
        run: |
          if [ "$IS_TRIVIAL" = "true" ] && [ "$IS_LOCAL_ONLY" != "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            if [ "$IS_LOCAL_ONLY" != "true" ]; then
              gh issue edit "$ISSUE_URL" --add-label local-only
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.proceed == 'true'

      # Will fail until WIF_PROVIDER / GCP_PROJECT_AI secrets exist - expected
      # at this stage (see Prompt 3 prerequisites). Assumes a service account
      # named agent-pipeline@<project>.iam.gserviceaccount.com; adjust to
      # match whatever name you actually create during GCP setup.
      - name: Authenticate to GCP
        if: steps.decide.outputs.proceed == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: agent-pipeline@${{ secrets.GCP_PROJECT_AI }}.iam.gserviceaccount.com

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.proceed == 'true'
        with:
          python-version: "3.12"

      - name: Score issue completeness
        id: triage
        if: steps.decide.outputs.proceed == 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GCP_PROJECT_AI: ${{ secrets.GCP_PROJECT_AI }}
        run: python3 scripts/triage.py

      - name: Check for platform-API acceptance criteria
        id: platform-check
        if: steps.decide.outputs.proceed == 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          target_path=$(printf '%s' "$ISSUE_BODY" | sed -n '/### Package\/service path/,/###/p')
          is_native_adapter=false
          if printf '%s' "$target_path" | grep -qE 'adapter-(mac|android)'; then
            is_native_adapter=true
          fi

          mentions_platform_api=false
          if printf '%s' "$ISSUE_BODY" | grep -qiE 'bluetooth|corebluetooth|telephonymanager'; then
            mentions_platform_api=true
          fi

          if [ "$is_native_adapter" = true ] && [ "$mentions_platform_api" = true ]; then
            echo "needs_opus=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_opus=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply labels
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          SCORE: ${{ steps.triage.outputs.score }}
          MISSING: ${{ steps.triage.outputs.missing }}
          NEEDS_OPUS: ${{ steps.platform-check.outputs.needs_opus }}
        run: |
          if awk "BEGIN {exit !($SCORE >= 0.8)}"; then
            gh issue edit "$ISSUE_URL" --add-label agent-ready
            if [ "$NEEDS_OPUS" = "true" ]; then
              gh issue edit "$ISSUE_URL" --add-label model:opus
            fi
          else
            gh issue edit "$ISSUE_URL" --add-label needs-spec
            gh issue comment "$ISSUE_URL" --body "This issue isn't ready for an agent yet - missing or empty: ${MISSING}. Please fill in the agent-task template's required sections."
          fi
