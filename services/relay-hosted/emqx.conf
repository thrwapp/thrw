##
## thrw relay - EMQX 5 configuration (docs/spec/architecture.md's "MQTT
## topic design", ADR 0001). Baked into the image. The actual relay
## credential is never written here - it's supplied at container start
## as EMQX_RELAY_USERNAME / EMQX_RELAY_PASSWORD and turned into an
## authentication bootstrap file by docker-entrypoint-relay.sh before
## EMQX starts. See docs/handoffs/80.md for the full rationale.
##

## The Dockerfile COPYs this file straight over /opt/emqx/etc/emqx.conf,
## replacing the stock image's default config entirely rather than
## merging with it - which means node.name/cookie/data_dir (required by
## EMQX's config schema, no built-in default) have to be set here too.
## Confirmed live: without this block, EMQX refuses to boot at all -
## `hocon_tconf:assert` fails with required_field errors for node.cookie
## and node.data_dir before the process even starts. This is a single,
## non-clustered node, so the cookie's value only has to satisfy the
## schema - there's no second node for it to authenticate distribution
## with - hence a fixed value baked in rather than sourced from a secret.
node {
  name = "emqx@127.0.0.1"
  cookie = "thrw-relay-single-node-cookie"
  data_dir = "/opt/emqx/data"
}

## Only the plaintext WebSocket listener is exposed. ADR 0001 chose
## MQTT-over-WebSocket as the transport, and
## docs/ops/prompt-5-gcp-and-branch-protection.md's relay VM firewall
## only allows 8083 (this listener) and 18083 (the dashboard/status
## API) inbound. TLS (wss/8084) is explicitly out of scope for this
## issue - no domain name or certificate exist yet - so it stays
## disabled here rather than left reachable with no cert. Raw MQTT
## (tcp/ssl) was never part of ADR 0001's decision either.
listeners.tcp.default.enable = false
listeners.ssl.default.enable = false
listeners.wss.default.enable = false

## Confirmed live: with no dashboard block at all, EMQX's HTTP API/status
## listener never starts (no "started"/"NOT started" log line for it at
## all, unlike the MQTT listeners above which log one or the other) -
## the process is up, ws:default answers on 8083, but 18083 gets no TCP
## response whatsoever. Same underlying cause as the missing node.*
## block: COPYing over the whole default emqx.conf drops this too, and
## unlike node.name/cookie it doesn't even fail loudly - it just silently
## never binds. Explicit bind here, rather than relying on whatever the
## stock image's own default file would have set.
dashboard.listeners.http.bind = 18083

## No allow_anonymous setting here at all, in any form - confirmed live,
## twice: neither a bare top-level `allow_anonymous = false` nor
## `mqtt.allow_anonymous = false` are recognized fields in EMQX 5.8.0's
## schema (the second attempt failed outright at boot with
## unknown_fields, unlike the first attempt's silent warning). EMQX 5
## has no separate global anonymous-access toggle at all: whether a
## connection needs credentials is determined entirely by whether an
## `authentication` chain is configured, which it is, immediately below.
## An empty `authentication = []` would mean every client connects
## anonymously; a non-empty one (ours) means every client must pass it -
## there is nothing else to set.
##
## Single shared relay credential. This is a deliberate interim choice,
## not an oversight: services/accounts (real per-tenant auth) doesn't
## exist yet, so every adapter authenticates as the same relay user for
## now (see docs/handoffs/80.md). password_hash_algorithm "plain"
## stores that one credential unhashed in EMQX's built-in database,
## which is acceptable only because it's a single shared operational
## secret rotated by redeploying, not a per-user password.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = plain
    }
    bootstrap_file = "/opt/emqx/data/authn-bootstrap/relay-users.csv"
    bootstrap_type = plain
  }
]

## Topic ACL (acl.conf) scoped to the thrw/# prefix - see that file for
## the full topic list and why it applies to "all" rather than a
## specific username under the current single-credential setup.
authorization {
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
  no_match = deny
  deny_action = disconnect
}
