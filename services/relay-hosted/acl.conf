%% Topic ACL for the thrw relay, scoped to the `thrw/#` prefix from
%% docs/spec/architecture.md's "MQTT topic design" section:
%%
%%   thrw/{account}/nodes/{node}/events
%%   thrw/{account}/commands/{node}
%%   thrw/{account}/state
%%   thrw/{account}/nodes/{node}/heartbeat
%%
%% This is an interim single-shared-credential deployment (see
%% docs/handoffs/80.md) - every authenticated client currently uses the
%% same relay user, so rules key on topic ("all" clients) rather than a
%% specific username. That still keeps the broker's topic namespace from
%% being fully open, which is the point of this file: anonymous access is
%% already rejected by emqx.conf's `allow_anonymous = false`, and this
%% ACL additionally denies anything outside `thrw/#` even once
%% authenticated.
{allow, all, subscribe, ["thrw/#"]}.
{allow, all, publish, ["thrw/#"]}.
{deny, all}.
